<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender Kegiatan PMIPTI Yogyakarta 2026–2027</title>
<style>
:root{--bg:#050505;--card:#080808;--fg:#f5f5f2;--muted:#929292;--line:#292929;--sel:#fff;color-scheme:dark;--psdm:#71c985;--sosbud:#ffad5a;--pemsos:#73b9ff;--immas:#c99aff;--perkom:#ff7777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;line-height:1.25;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.045;background-image:radial-gradient(#fff .55px,transparent .7px);background-size:4px 4px}
main{max-width:1500px;margin:0 auto;padding:clamp(18px,3vw,42px) clamp(14px,3vw,44px) 72px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(25px,5vw,65px);border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:clamp(1rem,2vw,1.35rem);letter-spacing:-.045em;margin:0;font-weight:800;text-transform:uppercase}.sub{color:var(--muted);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin:7px 0 0}.edition{font-size:.68rem;color:var(--muted);text-align:right;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.card{background:transparent;border:0;border-radius:0}.legend{padding:0;margin-bottom:clamp(32px,5vw,64px)}.legend h2{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;margin:0 0 6px}.legend p{margin:0 0 13px;color:var(--muted);font-size:.72rem}.lg{display:flex;flex-wrap:wrap;gap:4px 18px}.lg button{display:flex;align-items:center;gap:8px;border:0;border-bottom:1px solid transparent;background:none;color:var(--fg);text-align:left;padding:8px 0;border-radius:0;cursor:pointer;font:inherit;font-size:.72rem;transition:opacity .25s,border-color .25s;}.lg button:hover{border-color:var(--c)}.lg button.off{opacity:.28}.lg button.off .sw{background:transparent;border:1px solid var(--c)}.sw{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);border:1px solid var(--c)}.lg small{display:none}
.cal{padding:0;margin-bottom:clamp(34px,6vw,76px)}.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-bottom:14px;padding:0}.nav h2{margin:0;font-size:clamp(2.5rem,9.5vw,8.6rem);line-height:.86;letter-spacing:-.09em;font-weight:900;text-transform:uppercase;animation:titleIn .65s cubic-bezier(.2,.75,.2,1) both}.nav button{width:44px;height:44px;border-radius:50%;border:1px solid #414141;background:transparent;color:var(--fg);font-size:1.5rem;cursor:pointer;transition:background .25s,color .25s,transform .25s}.nav button:first-child{justify-self:start}.nav button:last-child{justify-self:end}.nav button:hover:not(:disabled){background:var(--fg);color:var(--bg);transform:scale(1.06)}.nav button:disabled{opacity:.2;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,.65vw,9px);transition:opacity .2s}.dh{text-align:left;font-size:clamp(.45rem,.8vw,.68rem);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 0 10px 2px}.day{aspect-ratio:1/1;border:0;background:transparent;border-radius:0;color:var(--fg);font:inherit;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:5px;padding:clamp(3px,.7vw,10px);cursor:default;min-width:0;position:relative;isolation:isolate;animation:dayIn .6s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0)*18ms);transition:background .25s,color .25s,transform .25s}.day.has{cursor:pointer}.day.has:before{content:"";position:absolute;inset:0;background:#fff;transform:scaleY(0);transform-origin:bottom;transition:transform .3s cubic-bezier(.2,.75,.2,1);z-index:-1}.day.has:hover:before,.day.sel:before{transform:scaleY(1)}.day.has:hover,.day.sel{color:#050505;transform:translateY(-2px)}.day.out{visibility:hidden}.n{font-size:clamp(1.15rem,5.3vw,5.3rem);line-height:.85;font-weight:900;letter-spacing:-.085em;font-variant-numeric:tabular-nums}.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-start;min-height:8px}.dot{width:clamp(4px,.55vw,8px);height:clamp(4px,.55vw,8px);border-radius:50%;background:var(--c);transition:transform .25s}.day.has:hover .dot,.day.sel .dot{transform:scale(1.15)}.hint{text-align:left;color:var(--muted);font-size:.7rem;margin:16px 0 0;letter-spacing:.02em}
.det{padding:0}.dt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 0 13px;border-bottom:1px solid var(--line)}.dt h3{margin:0;font-size:clamp(1.4rem,3.4vw,2.6rem);font-weight:850;letter-spacing:-.06em}.dt button{border:0;background:none;color:var(--muted);text-decoration:underline;font:inherit;font-size:.75rem;cursor:pointer}.row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line);font-size:.85rem;animation:rowIn .4s ease both}.row .d{flex:none;width:100px;color:var(--muted);font-size:.72rem;padding-top:1px}.row .sw{width:7px;height:7px;margin-top:5px}.row small{display:block;color:var(--muted);font-size:.75rem;margin-top:4px}.empty{padding:18px 0;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}h3.sec{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:clamp(38px,7vw,80px) 0 14px}.det .row:first-child{border-top:0}
@keyframes dayIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}@keyframes titleIn{from{opacity:0;transform:translateY(18px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0)}}@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:900px){.grid{gap:8px}.day{aspect-ratio:1.15/1}.n{font-size:clamp(3rem,6.2vw,6rem)}}@media(max-width:520px){main{padding:18px 12px 48px}header{align-items:flex-start;flex-direction:column;gap:8px}.edition{text-align:left}.nav h2{font-size:clamp(2.5rem,10vw,4.2rem)}.nav button{width:34px;height:34px;font-size:1.2rem}.day{aspect-ratio:1/1;padding:4px 2px}.n{font-size:clamp(1.1rem,6.5vw,2.2rem)}.dh{font-size:.53rem;padding-bottom:7px}.row .d{width:76px}.hint{font-size:.66rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<header>
<div><h1>PMIPTI Yogyakarta</h1><p class="sub">Kalender Kegiatan · Periode 2026–2027</p></div><div class="edition">Program Kerja<br>5 Departments</div>
</header>

<section class="card legend">
<h2>Department Index</h2>
<p>Pilih departemen untuk menyaring kegiatan kalender.</p>
<div class="lg" id="lg"></div>
</section>

<section class="card cal">
<div class="nav"><button id="prev" aria-label="Bulan sebelumnya">‹</button><h2 id="title"></h2><button id="next" aria-label="Bulan berikutnya">›</button></div>
<div class="grid" id="grid"></div>
<p class="hint">● Titik berwarna menandakan kegiatan · Pilih tanggal untuk melihat rincian.</p>
</section>

<section class="card det">
<div class="dt"><h3 id="dtitle"></h3><button id="reset" hidden>Tampilkan semua</button></div>
<div id="list"></div>
</section>

<h3 class="sec">Kegiatan rutin dan sesuai kebutuhan</h3>
<section class="card det" id="rec"></section>
</main>
<script>
const D={PSDM:["#2e7d32","PSDM","Pengembangan Sumber Daya Manusia"],SOSBUD:["#d1690f","SOSBUD","Sosial dan Budaya"],PEMSOS:["#1f6fb5","PEMSOS","Penerangan dan Media Sosial"],IMMAS:["#7b3fa0","IMMAS","Imigrasi dan Kemahasiswaan"],PERKOM:["#c0392b","PERKOM","Perekonomian"]};
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
// [tahun, bulan, tanggal (0 = sepanjang bulan), departemen, kegiatan]
const E=[
[2026,11,14,"PSDM","Diskusi buku"],[2026,11,30,"PEMSOS","Dakwah Digital"],[2026,11,0,"SOSBUD","Kunjungan masyarakat (ke-1)"],
[2026,12,18,"PSDM","Diskusi ilmiah"],[2026,12,26,"PSDM","Hukum bacaan Al-Qur’an (tajwid)"],[2026,12,28,"PEMSOS","PMIPTI Talks"],
[2027,1,6,"PSDM","Peringatan Isra Mikraj"],[2027,1,24,"PSDM","Nisfu Sya’ban"],[2027,1,30,"PEMSOS","Dakwah Digital"],[2027,1,0,"SOSBUD","Bakti membersihkan lingkungan (sebelum Ramadan)"],[2027,1,0,"SOSBUD","Kalender hari penting Patani selesai"],
[2027,2,28,"PEMSOS","PMIPTI Talks"],
[2027,3,19,"PSDM","Diskusi ilmiah"],[2027,3,27,"PSDM","Hukum tentang jenazah"],[2027,3,30,"PEMSOS","Dakwah Digital"],[2027,3,0,"SOSBUD","Kunjungan masyarakat (ke-2)"],
[2027,4,23,"PSDM","Diskusi ilmiah"],[2027,4,25,"SOSBUD","Tragedi Dusun Nya (rencana 25–28 April)"],[2027,4,28,"PEMSOS","PMIPTI Talks"],
[2027,5,17,"PSDM","Diskusi buku"],[2027,5,30,"PEMSOS","Dakwah Digital"],
[2027,6,6,"PSDM","Tahun Baru Islam dan Bubur Asyura"],[2027,6,28,"PEMSOS","PMIPTI Talks"],
[2027,7,25,"PSDM","Diskusi ilmiah"],[2027,7,30,"PEMSOS","Dakwah Digital"],[2027,7,0,"SOSBUD","Donasi barang dan pakaian"],[2027,7,0,"SOSBUD","Kunjungan masyarakat (ke-3)"],
[2027,8,13,"SOSBUD","Seminar Haji Sulong (tanggal 13 atau 18, perlu konfirmasi)"],[2027,8,15,"PSDM","Maulid Nabi SAW"],[2027,8,28,"PEMSOS","PMIPTI Talks"],
[2027,9,10,"PSDM","Diskusi ilmiah"],[2027,9,30,"PEMSOS","Dakwah Digital"],[2027,9,0,"PEMSOS","Mulai memilih foto untuk album"],
[2027,10,23,"PSDM","Diskusi buku"],[2027,10,25,"SOSBUD","Tragedi Takbai (belum ada di tabel kegiatan)"],[2027,10,28,"PEMSOS","PMIPTI Talks"],
[2027,11,30,"PEMSOS","Dakwah Digital"],
[2027,12,28,"PEMSOS","PMIPTI Talks"],[2027,12,0,"SOSBUD","Transfer peti khairat dan evaluasi/LPJ"],[2027,12,0,"PEMSOS","Cetak album dan rapikan Drive Laporan"]
];
const R=[
["PSDM","Latihan malam Jumat, setiap Kamis malam (Nov 2026–Jan 2027 dan Mar–Des 2027)"],
["PSDM","Kajian agama dan workshop eksternal (jadwal belum ditentukan)"],
["IMMAS","Info kampus dan beasiswa setiap 2 bulan; pendampingan anggota baru; pengingat KRS; pengingat visa/ITAS 3 bulan sebelum habis"],
["PERKOM","Jualan makanan dan minuman 2 kali/bulan (Sabtu, minggu ke-2 dan ke-3); jualan di Rumah Pahlawan Wanita 2 kali/bulan (minggu ke-1 dan ke-3)"],
["PERKOM","Tur, transportasi tamu, bazar, ekspor produk: sesuai permintaan"],
["SOSBUD","Peti khairat berjalan sepanjang periode"],
["PEMSOS","Kelola akun media resmi dan simpan dokumentasi kegiatan"]
];
const $=id=>document.getElementById(id);
let idx=0,sel=0;const off=new Set();
function ym(i){const t=2026*12+10+i;return[Math.floor(t/12),t%12+1]}
const sw=k=>`<span class="sw" style="--c:${D[k][0]}"></span>`;
function legend(){
 $("lg").innerHTML=Object.keys(D).map(k=>`<button data-k="${k}" class="${off.has(k)?"off":""}" style="--c:${D[k][0]}">${sw(k)}<span><b>${D[k][1]}</b><small>${D[k][2]}</small></span></button>`).join("");
}
function rec(){
 const r=R.filter(x=>!off.has(x[0]));
 $("rec").innerHTML=r.map((x,i)=>`<div class="row" style="${i?"":"border-top:0"}">${sw(x[0])}<span><b>${x[0]}</b><small>${x[1]}</small></span></div>`).join("")||`<div class="empty">Tidak ada departemen yang dipilih.</div>`;
}
function render(){
 const [y,m]=ym(idx);
 $("title").textContent=MN[m-1]+" "+y;
 $("prev").disabled=idx===0;$("next").disabled=idx===13;
 const ev=E.filter(e=>e[0]===y&&e[1]===m&&!off.has(e[3]));
 const dim=new Date(y,m,0).getDate(),lead=new Date(y,m-1,1).getDay();
 let h=["Min","Sen","Sel","Rab","Kam","Jum","Sab"].map(d=>`<div class="dh">${d}</div>`).join("");
 const total=Math.ceil((lead+dim)/7)*7;
 for(let i=0;i<total;i++){
  const d=i-lead+1;
  if(d<1||d>dim){h+=`<div class="day out"></div>`;continue}
  const ds=ev.filter(e=>e[2]===d);
  const dots=[...new Set(ds.map(e=>e[3]))].map(k=>`<span class="dot" style="--c:${D[k][0]}"></span>`).join("");
  h+=`<button class="day${ds.length?" has":""}${sel===d?" sel":""}" style="--i:${i}" data-d="${ds.length?d:0}"><span class="n">${String(d).padStart(2,"0")}</span><span class="dots">${dots}</span></button>`;
 }
 $("grid").innerHTML=h;
 const list=ev.filter(e=>sel?e[2]===sel:true).sort((a,b)=>(a[2]||99)-(b[2]||99));
 $("dtitle").textContent=sel?`Kegiatan ${sel} ${MN[m-1]} ${y}`:`Semua kegiatan ${MN[m-1]} ${y}`;
 $("reset").hidden=!sel;
 $("list").innerHTML=list.length?list.map(e=>`<div class="row">${sw(e[3])}<span class="d">${e[2]?e[2]+" "+MN[m-1].slice(0,3):"Sepanjang bulan"}</span><span><b>${e[3]}</b><small style="font-size:.9rem;color:var(--fg)">${e[4]}</small></span></div>`).join(""):`<div class="empty">Tidak ada kegiatan terjadwal.</div>`;
}
$("lg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;off.has(k)?off.delete(k):off.add(k);sel=0;legend();rec();render()});
$("grid").addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;const d=+b.dataset.d;if(!d)return;sel=sel===d?0:d;render()});
$("reset").onclick=()=>{sel=0;render()};
$("prev").onclick=()=>{if(idx>0){idx--;sel=0;render()}};
$("next").onclick=()=>{if(idx<13){idx++;sel=0;render()}};
legend();rec();render();
</script>
</body>
</html>
