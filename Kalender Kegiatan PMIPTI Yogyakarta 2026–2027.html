<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalender Kegiatan PMIPTI Yogyakarta 2026–2027</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--fg:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--today:#eef3ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--fg:#f0f0ec;--muted:#a3a39c;--line:#383835;--today:#2a302a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--fg:#f0f0ec;--muted:#a3a39c;--line:#383835;--today:#2a302a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.25rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.f{border:2px solid var(--c);background:var(--c);color:#fff;border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer;font-weight:600}
.f.off{background:transparent;color:var(--fg);opacity:.55}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav h2{margin:0;font-size:1.3rem}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 14px;font-size:.9rem;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.note{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.note .ev{font-size:.78rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.dh{padding:6px 4px;text-align:center;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.day{min-height:92px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.day:nth-child(7n){border-right:0}
.day.out{background:transparent;opacity:.35}
.day.today{background:var(--today)}
.n{font-size:.78rem;color:var(--muted);font-weight:600}
.ev{background:var(--c);color:#fff;border-radius:5px;padding:2px 6px;font-size:.72rem;line-height:1.25}
.ev b{font-weight:700}
h3{font-size:1rem;margin:22px 0 8px}
ul.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
ul.list li{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
ul.list li:last-child{border-bottom:0}
.d{min-width:64px;color:var(--muted);font-size:.8rem;padding-top:1px}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:4px;font-size:.68rem;font-weight:700;padding:1px 6px;margin-right:6px}
.empty{padding:12px;color:var(--muted);font-size:.9rem}
@media (max-width:640px){.day{min-height:58px;padding:3px}.grid .ev span{display:none}.grid .ev{height:7px;padding:0}.n{font-size:.72rem}}
</style>
</head>
<body>
<main>
<h1>Kalender Kegiatan PMIPTI Yogyakarta</h1>
<p class="sub">Periode 2026–2027 · gabungan program kerja 5 departemen</p>
<div class="filters" id="filters"></div>
<div class="nav"><button id="prev">← Sebelumnya</button><h2 id="title"></h2><button id="next">Berikutnya →</button></div>
<div class="note" id="note"></div>
<div class="grid" id="grid"></div>
<h3>Daftar kegiatan bulan ini</h3>
<ul class="list" id="list"></ul>
<h3>Kegiatan rutin dan sesuai kebutuhan</h3>
<ul class="list" id="rec"></ul>
</main>
<script>
const D={PSDM:["#2e7d32","PSDM · Pengembangan SDM"],SOSBUD:["#c4600a","SOSBUD · Sosial dan Budaya"],PEMSOS:["#1f6fb5","PEMSOS · Penerangan dan Media Sosial"],IMMAS:["#7b3fa0","IMMAS · Imigrasi dan Kemahasiswaan"],PERKOM:["#b3262e","PERKOM · Perekonomian"]};
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
// [tahun, bulan(1-12), tanggal (0 = sepanjang bulan), departemen, kegiatan]
const E=[
[2026,11,14,"PSDM","Diskusi buku"],[2026,11,30,"PEMSOS","Dakwah Digital"],[2026,11,0,"SOSBUD","Kunjungan masyarakat (ke-1)"],
[2026,12,18,"PSDM","Diskusi ilmiah"],[2026,12,26,"PSDM","Hukum bacaan Al-Qur’an (tajwid)"],[2026,12,28,"PEMSOS","PMIPTI Talks"],
[2027,1,6,"PSDM","Peringatan Isra Mikraj"],[2027,1,24,"PSDM","Nisfu Sya’ban"],[2027,1,30,"PEMSOS","Dakwah Digital"],[2027,1,0,"SOSBUD","Bakti membersihkan lingkungan (sebelum Ramadan)"],[2027,1,0,"SOSBUD","Kalender hari penting Patani selesai"],
[2027,2,28,"PEMSOS","PMIPTI Talks"],
[2027,3,19,"PSDM","Diskusi ilmiah"],[2027,3,27,"PSDM","Hukum tentang jenazah"],[2027,3,30,"PEMSOS","Dakwah Digital"],[2027,3,0,"SOSBUD","Kunjungan masyarakat (ke-2)"],
[2027,4,23,"PSDM","Diskusi ilmiah"],[2027,4,25,"SOSBUD","Tragedi Dusun Nya (rencana 25–28 April)"],[2027,4,28,"PEMSOS","PMIPTI Talks"],
[2027,5,17,"PSDM","Diskusi buku"],[2027,5,30,"PEMSOS","Dakwah Digital"],
[2027,6,6,"PSDM","Tahun Baru Islam dan Bubur Asyura"],[2027,6,28,"PEMSOS","PMIPTI Talks"],
[2027,7,25,"PSDM","Diskusi ilmiah"],[2027,7,30,"PEMSOS","Dakwah Digital"],[2027,7,0,"SOSBUD","Donasi barang dan pakaian"],[2027,7,0,"SOSBUD","Kunjungan masyarakat (ke-3)"],
[2027,8,13,"SOSBUD","Seminar Haji Sulong (tanggal 13 atau 18, perlu konfirmasi)"],[2027,8,15,"PSDM","Maulid Nabi SAW"],[2027,8,28,"PEMSOS","PMIPTI Talks"],
[2027,9,10,"PSDM","Diskusi ilmiah"],[2027,9,30,"PEMSOS","Dakwah Digital"],[2027,9,0,"PEMSOS","Mulai memilih foto untuk album"],
[2027,10,23,"PSDM","Diskusi buku"],[2027,10,25,"SOSBUD","Tragedi Takbai (belum ada di tabel kegiatan)"],[2027,10,28,"PEMSOS","PMIPTI Talks"],
[2027,11,30,"PEMSOS","Dakwah Digital"],
[2027,12,28,"PEMSOS","PMIPTI Talks"],[2027,12,0,"SOSBUD","Transfer peti khairat dan evaluasi/LPJ"],[2027,12,0,"PEMSOS","Cetak album dan rapikan Drive Laporan"]
];
const R=[
["PSDM","Latihan malam Jumat, setiap Kamis malam (Nov 2026–Jan 2027 dan Mar–Des 2027)"],
["PSDM","Kajian agama dan workshop eksternal (jadwal belum ditentukan)"],
["IMMAS","Info kampus dan beasiswa setiap 2 bulan; pendampingan anggota baru; pengingat KRS; pengingat visa/ITAS 3 bulan sebelum habis"],
["PERKOM","Jualan makanan dan minuman 2 kali/bulan (Sabtu, minggu ke-2 dan ke-3); jualan di Rumah Pahlawan Wanita 2 kali/bulan (minggu ke-1 dan ke-3)"],
["PERKOM","Tur, transportasi tamu, bazar, ekspor produk: sesuai permintaan"],
["SOSBUD","Peti khairat berjalan sepanjang periode"],
["PEMSOS","Kelola akun media resmi dan simpan dokumentasi kegiatan"]
];
let idx=0;const off=new Set();
const $=id=>document.getElementById(id);
const base=[2026,11];
function ym(i){const t=base[0]*12+base[1]-1+i;return[Math.floor(t/12),t%12+1]}
function chip(e,full){return `<div class="ev" style="--c:${D[e[3]][0]}" title="${e[3]}: ${e[4]}"><b>${e[3]}</b> <span>${e[4]}</span></div>`}
function render(){
 const [y,m]=ym(idx);
 $("title").textContent=MN[m-1]+" "+y;
 $("prev").disabled=idx===0;$("next").disabled=idx===13;
 const ev=E.filter(e=>e[0]===y&&e[1]===m&&!off.has(e[3]));
 $("note").innerHTML=ev.filter(e=>e[2]===0).map(e=>`<div class="ev" style="--c:${D[e[3]][0]}"><b>${e[3]}</b> ${e[4]} · sepanjang bulan</div>`).join("");
 const first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate();
 const lead=(first.getDay()+6)%7;
 let h=["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(d=>`<div class="dh">${d}</div>`).join("");
 const now=new Date();
 const total=Math.ceil((lead+dim)/7)*7;
 for(let i=0;i<total;i++){
  const d=i-lead+1;
  if(d<1||d>dim){h+=`<div class="day out"></div>`;continue}
  const isT=now.getFullYear()===y&&now.getMonth()+1===m&&now.getDate()===d;
  h+=`<div class="day${isT?" today":""}"><div class="n">${d}</div>${ev.filter(e=>e[2]===d).map(e=>chip(e)).join("")}</div>`;
 }
 $("grid").innerHTML=h;
 const l=ev.slice().sort((a,b)=>(a[2]||99)-(b[2]||99));
 $("list").innerHTML=l.length?l.map(e=>`<li><span class="d">${e[2]?e[2]+" "+MN[m-1].slice(0,3):"Sepanjang bulan"}</span><span><span class="tag" style="--c:${D[e[3]][0]}">${e[3]}</span>${e[4]}</span></li>`).join(""):`<li class="empty">Tidak ada kegiatan terjadwal pada bulan ini.</li>`;
}
$("filters").innerHTML=Object.keys(D).map(k=>`<button class="f" data-k="${k}" style="--c:${D[k][0]}">${D[k][1]}</button>`).join("");
$("filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;off.has(k)?off.delete(k):off.add(k);b.classList.toggle("off");render();renderRec()});
function renderRec(){$("rec").innerHTML=R.filter(r=>!off.has(r[0])).map(r=>`<li><span><span class="tag" style="--c:${D[r[0]][0]}">${r[0]}</span>${r[1]}</span></li>`).join("")}
$("prev").onclick=()=>{if(idx>0){idx--;render()}};
$("next").onclick=()=>{if(idx<13){idx++;render()}};
render();renderRec();
</script>
</body>
</html>
